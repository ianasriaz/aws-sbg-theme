name: Deploy to WordPress

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Prepare deployment package
        run: |
          # Ship the ENTIRE theme (no path whitelist to rot), minus repo/dev-only files.
          mkdir -p deploy
          rsync -a ./ deploy/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.commandcode/' \
            --exclude 'config/seed-*.json'

          echo "=== Files ready for deployment ==="
          find deploy -type f | head -20
          echo "... ($(find deploy -type f | wc -l) total files)"

      - name: Clean target directories on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          script: |
            TARGET="${{ secrets.REMOTE_PATH }}"
            case "$TARGET" in
              *themes*)
                rm -rf "$TARGET"/*
                echo "Cleaned $TARGET"
                ;;
              *)
                echo "Refusing to clean unexpected path: $TARGET (must contain 'themes')"
                exit 1
                ;;
            esac

      - name: Pack archive
        run: tar -czf deploy.tar.gz -C deploy .

      - name: Upload archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          source: "deploy.tar.gz"
          target: "/tmp/"
          strip_components: 0
          rm: false
          overwrite: true

      - name: Extract on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          script: |
            TARGET="${{ secrets.REMOTE_PATH }}"
            tar -xzf /tmp/deploy.tar.gz -C "$TARGET" --no-same-owner --no-same-permissions --touch
            rm -f /tmp/deploy.tar.gz
            echo "Extracted to $TARGET"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          script: |
            cd "${{ secrets.REMOTE_PATH }}"
            echo "=== Deployed tree ==="
            ls -la
            test -f style.css && echo "OK: style.css"
            test -f functions.php && echo "OK: functions.php"
            test -f includes/admin/admin-design-kit.php && echo "OK: Brand Kit admin page"
            test -f assets/design-kit/design-kit.js && echo "OK: Design Kit bundle"
            test -f templates/pages/page-reinvent.php && echo "OK: re:Invent template"

      - name: Deployment Summary
        run: |
          echo "### Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
