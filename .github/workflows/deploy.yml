name: Deploy to WordPress

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      
      - name: Prepare deployment package
        run: |
          # Create deploy directory with only required files
          mkdir -p deploy
          
          # Copy theme core files
          cp style.css functions.php header.php footer.php README.md deploy/ 2>/dev/null || true
          
          # Copy directories needed on server
          cp -r assets/images deploy/assets/ 2>/dev/null || true
          cp -r assets/css deploy/assets/ 2>/dev/null || true
          cp -r assets/js deploy/assets/ 2>/dev/null || true
          cp -r assets/fonts deploy/assets/ 2>/dev/null || true
          cp -r includes deploy/
          cp -r templates deploy/
          cp -r languages deploy/ 2>/dev/null || true
          
          # Copy config files (except seed data)
          cp config/config-theme.php deploy/config/ 2>/dev/null || true
          
          echo "=== Files ready for deployment ==="
          find deploy -type f | head -20
          echo "... ($(find deploy -type f | wc -l) total files)"
      
      - name: Deploy to WordPress (SFTP with Password)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          source: "deploy/*"
          target: ${{ secrets.REMOTE_PATH }}
          strip_components: 1
          rm: false
          overwrite: true
      
      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Branch: ${{ github.event.inputs.branch }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed at: $(date)"
